# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  HacksToHacks — Multi-Platform Release Pipeline                         ║
# ║                                                                          ║
# ║  Inspired by Godot Engine's build system.                                ║
# ║  Each platform builds independently; a final "release" job              ║
# ║  downloads all artifacts and publishes a single GitHub Release.         ║
# ║                                                                          ║
# ║  Platforms:                                                              ║
# ║    🍎  iOS / iPadOS    → HacksToHacks.ipa        (macos-latest)         ║
# ║    🪟  Windows         → HacksToHacks-Windows.zip (.exe + assets)       ║
# ║    🐧  Linux SDL3      → HacksToHacks-Linux-SDL3.zip (binary + assets)  ║
# ║    🎮  Wii U           → HacksToHacks-WiiU.zip   (.rpx homebrew)        ║
# ║                                                                          ║
# ║  Triggers:                                                               ║
# ║    • Every push to main  → "nightly" rolling release                    ║
# ║    • Every tag  v*       → stable versioned release                     ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name: 🚀 Multi-Platform Release

on:
  push:
    branches: ["main"]
    tags:     ["v*"]
  pull_request:
    branches: ["main"]

# Allow creating releases
permissions:
  contents: write

# ──────────────────────────────────────────────────────────────────────────────
# 1. iOS / iPadOS  (macos-latest → arm64 IPA)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build-ios:
    name: 🍎 Build iOS / iPadOS IPA
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build game for iOS
        run: |
          # Download prebuilt raylib iOS XCFrameworks
          curl -LO https://github.com/ghera/raylib-iOS/releases/download/6.0.3-iOS/raylib-ios-xcframeworks-6.0.3-iOS.zip
          unzip -q raylib-ios-xcframeworks-6.0.3-iOS.zip -d raylib-xcf
          
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC="xcrun -sdk iphoneos clang"
          
          # We use the ios-arm64 slices of the xcframeworks
          XCF_DIR="$PWD/raylib-xcf/raylib-ios-xcframeworks"
          RAYLIB_FW="$XCF_DIR/raylib.xcframework/ios-arm64"
          EGL_FW="$XCF_DIR/libEGL.xcframework/ios-arm64"
          GLES_FW="$XCF_DIR/libGLESv2.xcframework/ios-arm64"
          
          mkdir -p build-ios/HacksToHacks.app
          CFLAGS="-target arm64-apple-ios13.0 -isysroot $IOS_SDK -O2 -fPIC -Isrc -I$RAYLIB_FW/raylib.framework/Headers -mios-version-min=13.0 -Wno-deprecated-declarations"
          
          # Compile all .c files in src/
          for srcfile in src/*.c; do
            objfile="build-ios/$(basename "${srcfile%.c}.o")"
            $CC $CFLAGS -x c -c "$srcfile" -o "$objfile"
          done
          
          # Link Game
          $CC -target arm64-apple-ios13.0 -isysroot $IOS_SDK -mios-version-min=13.0 \
            build-ios/*.o \
            -F "$RAYLIB_FW" -F "$EGL_FW" -F "$GLES_FW" \
            -framework raylib -framework libEGL -framework libGLESv2 \
            -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics \
            -o build-ios/HacksToHacks.app/HacksToHacks
          
          echo "Build OK"

      - name: Create Info.plist (iPhone + iPad)
        run: |
          python3 - << 'PYEOF'
          plist = '''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>HacksToHacks</string>
              <key>CFBundleIdentifier</key><string>com.hackstohacks.game</string>
              <key>CFBundleName</key><string>HacksToHacks</string>
              <key>CFBundleDisplayName</key><string>HacksToHacks</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>MinimumOSVersion</key><string>13.0</string>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIStatusBarHidden</key><true/>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
          </dict>
          </plist>'''
          with open('Info.plist', 'w') as f: f.write(plist)
          print('Info.plist OK')
          PYEOF

      - name: Package .app → .ipa
        run: |
          # CMake generates the .app bundle in build-ios/HacksToHacks.app
          # Overwrite its Info.plist with our custom AltStore one
          cp Info.plist build-ios/HacksToHacks.app/Info.plist
          
          mkdir -p Payload
          cp -r build-ios/HacksToHacks.app Payload/
          zip -r HacksToHacks.ipa Payload/
          echo "IPA size: $(du -sh HacksToHacks.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: HacksToHacks.ipa
          retention-days: 7

# ──────────────────────────────────────────────────────────────────────────────
# 2. Windows  (windows-latest → MSVC/LLVM .exe + assets zip)
# ──────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW via Chocolatey
        run: choco install mingw -y --no-progress

      - name: Download pre-built raylib Windows SDK
        shell: pwsh
        run: |
          $url = "https://github.com/raysan5/raylib/releases/download/5.0/raylib-5.0_win64_mingw-w64.zip"
          Invoke-WebRequest -Uri $url -OutFile raylib-win.zip
          Expand-Archive raylib-win.zip -DestinationPath raylib-win
          $RL = Get-ChildItem raylib-win -Directory | Select-Object -First 1
          echo "RAYLIB_ROOT=$($RL.FullName)" >> $env:GITHUB_ENV

      - name: Compile game (MinGW)
        shell: bash
        run: |
          RL="$RAYLIB_ROOT"
          mkdir -p out-win
          gcc -O2 -Wall \
            -I"$RL/include" -Isrc \
            src/main.c src/cJSON.c src/tween.c \
            -o out-win/HacksToHacks.exe \
            -L"$RL/lib" -lraylib \
            -lgdi32 -lwinmm -lopengl32
          echo "EXE OK: $(ls -lh out-win/HacksToHacks.exe)"

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force win-dist
          Copy-Item out-win\HacksToHacks.exe win-dist\
          # Copy raylib DLL if present (static link usually means no DLL)
          Get-ChildItem "$env:RAYLIB_ROOT\bin" -Filter "*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination win-dist\ -ErrorAction SilentlyContinue
          if (Test-Path assets)  { Copy-Item -Recurse assets  win-dist\ }
          if (Test-Path locales) { Copy-Item -Recurse locales win-dist\ }
          # Add a launcher README
          Set-Content win-dist\README.txt @"
          HacksToHacks - Windows
          ======================
          Esegui HacksToHacks.exe per avviare il gioco.
          Requisiti: Windows 10+ x64
          "@
          Compress-Archive win-dist\* HacksToHacks-Windows.zip
          Write-Host "ZIP size: $((Get-Item HacksToHacks-Windows.zip).Length / 1MB) MB"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: HacksToHacks-Windows.zip
          retention-days: 7

# ──────────────────────────────────────────────────────────────────────────────
# 3. Linux SDL3  (ubuntu-latest → SDL3 + raylib → zip)
# ──────────────────────────────────────────────────────────────────────────────
  build-linux-sdl3:
    name: 🐧 Build Linux (SDL3 backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev \
            libdecor-0-dev pkg-config

      - name: Build SDL3 from source (FetchContent-style)
        run: |
          git clone --depth 1 --branch release-3.2.16 https://github.com/libsdl-org/SDL.git SDL3-src
          cmake -S SDL3-src -B SDL3-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_STATIC=OFF \
            -DSDL_SHARED=ON \
            -DCMAKE_INSTALL_PREFIX=$PWD/SDL3-install
          cmake --build SDL3-build --config Release -j$(nproc)
          cmake --install SDL3-build
          echo "SDL3_DIR=$PWD/SDL3-install/lib/cmake/SDL3" >> $GITHUB_ENV
          echo "SDL3_INC=$PWD/SDL3-install/include" >> $GITHUB_ENV
          echo "SDL3_LIB=$PWD/SDL3-install/lib" >> $GITHUB_ENV

      - name: Build raylib for Linux (as static library)
        run: |
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git raylib-src
          cmake -S raylib-src -B raylib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build raylib-build --config Release -j$(nproc)
          echo "RAYLIB_BUILD=$PWD/raylib-build" >> $GITHUB_ENV

      - name: Compile game with SDL3 backend
        run: |
          RL_SRC=raylib-src/src
          RL_LIB=$RAYLIB_BUILD/raylib

          mkdir -p out-linux

          # Compile main game sources (raylib rendering, SDL3 window)
          gcc -O2 -Wall \
            -DPLATFORM_DESKTOP \
            -Isrc -I$RL_SRC \
            -I$SDL3_INC \
            -c src/main.c       -o out-linux/main.o
          gcc -O2 -Wall -Isrc -c src/cJSON.c  -o out-linux/cJSON.o
          gcc -O2 -Wall -Isrc -c src/tween.c  -o out-linux/tween.o

          # Compile SDL3 platform adapter
          gcc -O2 -Wall \
            -DPLATFORM_SDL3 \
            -Isrc -I$SDL3_INC \
            -c src/platform_sdl3.c -o out-linux/platform_sdl3.o

          # Link everything
          gcc out-linux/main.o out-linux/cJSON.o out-linux/tween.o \
              out-linux/platform_sdl3.o \
              $RL_LIB/libraylib.a \
              -L$SDL3_LIB -lSDL3 \
              -Wl,-rpath,'$ORIGIN' \
              -lGL -lm -ldl -lpthread -lrt \
              -lX11 -lXrandr -lXi -lXcursor -lXinerama \
              -lasound -lpulse \
              -o out-linux/HacksToHacks

          file out-linux/HacksToHacks

      - name: Package Linux SDL3 ZIP
        run: |
          mkdir -p linux-dist
          cp out-linux/HacksToHacks linux-dist/
          cp $SDL3_LIB/libSDL3.so* linux-dist/ 2>/dev/null || true
          chmod +x linux-dist/HacksToHacks
          cp -r assets  linux-dist/ 2>/dev/null || true
          cp -r locales linux-dist/ 2>/dev/null || true
          cat > linux-dist/run.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./HacksToHacks
          EOF
          chmod +x linux-dist/run.sh
          cat > linux-dist/README.txt << 'EOF'
          HacksToHacks - Linux (SDL3 Build)
          ==================================
          Esegui: ./run.sh   oppure   ./HacksToHacks
          Requisiti: Linux x86_64, GPU con OpenGL 3.3+
          SDL3 è linkato staticamente — nessuna dipendenza extra richiesta.
          EOF
          cd linux-dist
          zip -r ../HacksToHacks-Linux-SDL3.zip .
          cd ..
          echo "ZIP size: $(du -sh HacksToHacks-Linux-SDL3.zip)"

      - name: Upload Linux SDL3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-sdl3-zip
          path: HacksToHacks-Linux-SDL3.zip
          retention-days: 7

# ──────────────────────────────────────────────────────────────────────────────
# 4. Wii U  (ubuntu → devkitPro container → .rpx homebrew)
# ──────────────────────────────────────────────────────────────────────────────
  build-wiiu:
    name: 🎮 Build Wii U RPX
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Wii U RPX via Docker
        run: |
          docker run --rm -v $PWD:/project -w /project devkitpro/devkitppc:latest /bin/bash -c "\
            dkp-pacman -Syu --noconfirm || true && \
            dkp-pacman -S --noconfirm --needed wiiu-dev wiiu-sdl2 wiiu-sdl2_ttf && \
            mkdir -p wiiu-build && \
            cmake -S wiiu -B wiiu-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/WiiU.cmake && \
            cmake --build wiiu-build --config Release -j\$(nproc) \
          "

      - name: Locate and collect .rpx file
        run: |
          # WUT generates .rpx next to the ELF
          RPX=$(find wiiu-build -name "*.rpx" | head -1)
          if [ -z "$RPX" ]; then
            echo "ERROR: .rpx not found. Listing build dir:"
            find wiiu-build -type f
            exit 1
          fi
          echo "Found RPX: $RPX"
          mkdir -p wiiu-dist
          cp "$RPX" wiiu-dist/HacksToHacks.rpx
          cat > wiiu-dist/install.txt << 'EOF'
          HacksToHacks - Wii U Homebrew
          ==============================
          1. Copia HacksToHacks.rpx sulla tua SD card in:
               sd:/wiiu/apps/HacksToHacks/HacksToHacks.rpx
          2. Avvia il Homebrew Launcher sul tuo Wii U
          3. Seleziona HacksToHacks
          
          Requisiti: Wii U con custom firmware (Tiramisu o Aroma)
          Controlli: A = Avvia, HOME = Esci
          EOF

      - name: Package Wii U ZIP
        run: |
          cd wiiu-dist
          zip -r ../HacksToHacks-WiiU.zip .
          cd ..
          echo "WiiU ZIP size: $(du -sh HacksToHacks-WiiU.zip)"

      - name: Upload Wii U artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiiu-zip
          path: HacksToHacks-WiiU.zip
          retention-days: 7

# ──────────────────────────────────────────────────────────────────────────────
# 5. Publish Release  (Godot-style: collect all artifacts → single Release)
# ──────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: 📦 Publish GitHub Release
    runs-on: ubuntu-latest
    # Only publish on push (not PRs), after all builds succeed
    if: github.event_name == 'push'
    needs:
      - build-ios
      - build-windows
      - build-linux-sdl3
      - build-wiiu

    steps:
      - uses: actions/checkout@v4

      # Download every platform artifact into its own subfolder
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets/

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-assets/

      - name: Download Linux SDL3 ZIP
        uses: actions/download-artifact@v4
        with:
          name: linux-sdl3-zip
          path: release-assets/

      - name: Download Wii U ZIP
        uses: actions/download-artifact@v4
        with:
          name: wiiu-zip
          path: release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      # Determine release tag: stable (v*) vs nightly
      - name: Determine release info
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            NAME="HacksToHacks $TAG"
            PRERELEASE="false"
          else
            TAG="nightly"
            NAME="HacksToHacks Nightly ($(date +'%Y-%m-%d'))"
            PRERELEASE="true"
          fi
          echo "tag=$TAG"           >> $GITHUB_OUTPUT
          echo "name=$NAME"         >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.release_info.outputs.tag }}
          name:       ${{ steps.release_info.outputs.name }}
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          make_latest: true
          body: |
            ## 🎮 HacksToHacks — Multi-Platform Release

            Il gioco hacker finalmente su tutte le piattaforme!

            ### 📥 Download

            | Piattaforma | File | Note |
            |---|---|---|
            | 🍎 **iPhone / iPad** | `HacksToHacks.ipa` | Installa via AltStore |
            | 🪟 **Windows 10/11** | `HacksToHacks-Windows.zip` | Esegui `HacksToHacks.exe` |
            | 🐧 **Linux x86_64** | `HacksToHacks-Linux-SDL3.zip` | Backend SDL3 statico |
            | 🎮 **Wii U** | `HacksToHacks-WiiU.zip` | `.rpx` homebrew |

            ### 🍎 Installazione iOS/iPadOS (AltStore)
            Aggiungi questa sorgente in AltStore → Browse → `+`:
            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/altstore.json
            ```

            ### 🎮 Installazione Wii U
            Copia `HacksToHacks.rpx` su:
            ```
            sd:/wiiu/apps/HacksToHacks/HacksToHacks.rpx
            ```
            Richiede Tiramisu o Aroma CFW.

            ---
            *Build automatica da commit `${{ github.sha }}`*
          files: |
            release-assets/HacksToHacks.ipa
            release-assets/HacksToHacks-Windows.zip
            release-assets/HacksToHacks-Linux-SDL3.zip
            release-assets/HacksToHacks-WiiU.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
