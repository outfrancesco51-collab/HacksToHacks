name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Clone Raylib source
      run: |
        git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git raylib-src

    - name: Compile raylib for iOS arm64
      run: |
        IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        CC="xcrun -sdk iphoneos clang"
        AR="xcrun -sdk iphoneos ar"
        RAYLIB_SRC=raylib-src/src

        CFLAGS="-target arm64-apple-ios13.0 \
          -isysroot $IOS_SDK \
          -DPLATFORM_IOS \
          -DGRAPHICS_API_OPENGL_ES2 \
          -O2 -fPIC \
          -I$RAYLIB_SRC \
          -mios-version-min=13.0"

        mkdir -p raylib-ios-lib

        # Compile all raylib modules
        for f in rcore.c rshapes.c rtextures.c rtext.c rmodels.c raudio.c utils.c; do
          echo "Compiling $f..."
          $CC $CFLAGS -c $RAYLIB_SRC/$f -o raylib-ios-lib/${f%.c}.o
        done

        # rcore_apple.m is present in some versions - compile if found
        if [ -f "$RAYLIB_SRC/rcore_apple.m" ]; then
          $CC $CFLAGS -c $RAYLIB_SRC/rcore_apple.m -o raylib-ios-lib/rcore_apple.o
        fi

        $AR rcs raylib-ios-lib/libraylib.a raylib-ios-lib/*.o
        echo "libraylib.a compiled for iOS arm64 OK"

    - name: Compile game for iOS
      run: |
        IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        CC="xcrun -sdk iphoneos clang"
        RAYLIB_SRC=raylib-src/src

        CFLAGS="-target arm64-apple-ios13.0 \
          -isysroot $IOS_SDK \
          -DPLATFORM_IOS \
          -DGRAPHICS_API_OPENGL_ES2 \
          -O2 -fPIC \
          -Isrc \
          -I$RAYLIB_SRC \
          -mios-version-min=13.0"

        mkdir -p out-ios

        for f in main.c cJSON.c tween.c city3d.c cutscene.c minigame_fingerprint.c minigame_wires.c; do
          echo "Compiling src/$f..."
          $CC $CFLAGS -c src/$f -o out-ios/${f%.c}.o
        done

        # Link final executable
        $CC \
          -target arm64-apple-ios13.0 \
          -isysroot $IOS_SDK \
          -mios-version-min=13.0 \
          out-ios/main.o out-ios/cJSON.o out-ios/tween.o out-ios/city3d.o out-ios/cutscene.o out-ios/minigame_fingerprint.o out-ios/minigame_wires.o \
          -Lraylib-ios-lib -lraylib \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics \
          -framework QuartzCore \
          -framework CoreVideo \
          -framework AVFoundation \
          -framework AudioToolbox \
          -framework CoreMotion \
          -framework OpenGLES \
          -framework GLKit \
          -o out-ios/HacksToHacks

        echo "Executable compiled OK: $(file out-ios/HacksToHacks)"

    - name: Create Info.plist (iPhone + iPad support)
      run: |
        python3 - << 'PYEOF'
        plist = '''<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>HacksToHacks</string>
    <key>CFBundleIdentifier</key>
    <string>com.hackstohacks.game</string>
    <key>CFBundleName</key>
    <string>HacksToHacks</string>
    <key>CFBundleDisplayName</key>
    <string>HacksToHacks</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>LSRequiresIPhoneOS</key>
    <true/>
    <!-- Support both iPhone (1) and iPad (2) -->
    <key>UIDeviceFamily</key>
    <array>
        <integer>1</integer>
        <integer>2</integer>
    </array>
    <key>UIRequiredDeviceCapabilities</key>
    <array>
        <string>arm64</string>
    </array>
    <!-- iPhone landscape orientations -->
    <key>UISupportedInterfaceOrientations</key>
    <array>
        <string>UIInterfaceOrientationLandscapeLeft</string>
        <string>UIInterfaceOrientationLandscapeRight</string>
    </array>
    <!-- iPad landscape orientations -->
    <key>UISupportedInterfaceOrientations~ipad</key>
    <array>
        <string>UIInterfaceOrientationLandscapeLeft</string>
        <string>UIInterfaceOrientationLandscapeRight</string>
    </array>
    <key>MinimumOSVersion</key>
    <string>13.0</string>
    <!-- Full screen on all devices (no iPad split-view) -->
    <key>UIRequiresFullScreen</key>
    <true/>
    <!-- Status bar hidden for full immersion -->
    <key>UIStatusBarHidden</key>
    <true/>
    <key>UIViewControllerBasedStatusBarAppearance</key>
    <false/>
    <!-- AltStore / sideloading compatibility: no code signing required -->
    <key>SignerIdentity</key>
    <string>Apple iPhone OS Application Signing</string>
</dict>
</plist>'''
        with open('Info.plist', 'w') as f:
            f.write(plist)
        print('Info.plist written OK (iPhone + iPad support)')
        PYEOF

    - name: Create .app bundle and IPA
      run: |
        APP_DIR=HacksToHacks.app
        mkdir -p $APP_DIR

        # Copy executable
        cp out-ios/HacksToHacks $APP_DIR/
        # Copy plist
        cp Info.plist $APP_DIR/
        # Copy assets
        cp -r assets $APP_DIR/ 2>/dev/null || true
        cp -r locales $APP_DIR/ 2>/dev/null || true

        # Create IPA (standard AltStore/sideload format)
        mkdir -p Payload
        cp -r $APP_DIR Payload/
        zip -r HacksToHacks.ipa Payload/

        echo "IPA created: $(du -sh HacksToHacks.ipa)"
        echo "App bundle contents:"
        ls -la $APP_DIR/

    - name: Upload IPA as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: HacksToHacks-iOS-IPA
        path: HacksToHacks.ipa

    - name: Create GitHub Release with IPA (on push to main)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ios-latest
        name: "HacksToHacks iOS (Latest)"
        body: |
          ## Install on iPhone / iPad via AltStore

          1. Add this AltStore source: `https://raw.githubusercontent.com/${{ github.repository }}/main/altstore.json`
          2. In AltStore → Browse → (your source) → install **HacksToHacks**

          Or sideload manually: download `HacksToHacks.ipa` and open with AltStore / Sideloadly / ESign.

          **Requires:** iOS/iPadOS 13.0+, arm64 device (iPhone 6s and later, all iPad models from 2015+)
        files: HacksToHacks.ipa
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
